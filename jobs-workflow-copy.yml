name: Find jobs
on:
  schedule: [{ cron: '30 3 * * *' }, { cron: '30 7 * * *' }, { cron: '30 12 * * *' }, { cron: '30 16 * * *' }]   # 09:00, 13:00, 18:00, 22:00 IST
  workflow_dispatch:
permissions: { contents: write }
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test core/*.test.mjs fetch/*.test.mjs
      - run: node fetch/run.mjs
        env: { RESEND_API_KEY: '${{ secrets.RESEND_API_KEY }}', EMAIL_TO: '${{ secrets.EMAIL_TO }}' }
      - run: |
          git config user.name "${{ github.actor }}"; git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add docs/data/jobs.json; git diff --staged --quiet || (git commit -m "Update jobs" && git push)
      - run: '[ -z "$HOOK" ] || curl -fsS -X POST "$HOOK"'
        env: { HOOK: '${{ secrets.VERCEL_DEPLOY_HOOK }}' }
