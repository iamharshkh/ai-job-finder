 else{const l=D.jobs.filter(TABS[tab][2]).filter(j=>(j.title+j.company).toLowerCase().includes(q)).sort((a,b)=>b.matchPct-a.matchPct||(b.firstSeen||'').localeCompare(a.firstSeen||''));
